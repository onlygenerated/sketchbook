<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>sketchbook</title>
  <meta name="description" content="Creative coding experiments: generative art, animation and audio-reactive visuals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1a1918;
      --muted: #6f6a61;
      --line: #d9d2c4;
      --card: #fbf8f2;
      --accent: #c2412d;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11;
        --ink: #efeae0;
        --muted: #8d877c;
        --line: #26252a;
        --card: #16161a;
        --accent: #ff7a59;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 13px/1.55 var(--mono);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px 24px;
      padding: clamp(32px, 8vw, 88px) 0 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font: italic 400 clamp(56px, 13vw, 132px)/0.85 var(--serif);
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); font-style: normal; }
    .tagline { color: var(--muted); max-width: 34ch; text-align: right; }
    .count { font-variant-numeric: tabular-nums; color: var(--ink); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 16px 0 24px;
    }
    .filters button {
      appearance: none;
      font: inherit;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 11px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--ink); outline: none; }
    .thumb { position: relative; aspect-ratio: 1; background: #111; overflow: hidden; }
    .thumb img, .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .num {
      position: absolute;
      left: 10px;
      bottom: 4px;
      font: italic 400 46px/1 var(--serif);
      color: #fff;
      mix-blend-mode: difference;
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
    }
    .body { padding: 12px 14px 14px; }
    .title { font: 400 24px/1.1 var(--serif); margin: 0 0 6px; }
    .desc { color: var(--muted); margin: 0 0 10px; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
    .meta .tag::before { content: "#"; opacity: 0.6; }

    .empty { color: var(--muted); padding: 40px 0; }
    footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    footer a { color: inherit; }

    @media (max-width: 560px) {
      header { grid-template-columns: 1fr; }
      .tagline { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>sketch<span>/</span>book</h1>
      <p class="tagline">Experiments in generative art, motion and sound. <span class="count" id="count"></span></p>
    </header>
    <nav class="filters" id="filters" aria-label="Filter by tag"></nav>
    <main class="grid" id="grid"></main>
    <footer>
      Made with p5.js and Claude Code. Source on <a href="https://github.com/onlygenerated/sketchbook">GitHub</a>.
    </footer>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');
    let all = [];
    let active = null;

    // Small seeded random, so each sketch without a thumbnail gets a stable placeholder.
    function rng(str) {
      let h = 2166136261;
      for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
      return () => {
        h += 0x6d2b79f5;
        let t = h;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function placeholder(slug) {
      const c = document.createElement('canvas');
      const s = 300;
      c.width = c.height = s;
      const g = c.getContext('2d');
      const r = rng(slug);
      const hue = Math.floor(r() * 360);
      g.fillStyle = `hsl(${hue} 25% 9%)`;
      g.fillRect(0, 0, s, s);
      g.lineWidth = 1;
      for (let i = 0; i < 140; i++) {
        let x = r() * s;
        let y = r() * s;
        g.strokeStyle = `hsla(${(hue + r() * 90) % 360} 70% ${55 + r() * 30}% / 0.5)`;
        g.beginPath();
        g.moveTo(x, y);
        for (let k = 0; k < 40; k++) {
          const a = Math.sin(x * 0.012 + hue) * 2 + Math.cos(y * 0.015) * 2;
          x += Math.cos(a) * 3;
          y += Math.sin(a) * 3;
          g.lineTo(x, y);
        }
        g.stroke();
      }
      return c;
    }

    function card(s) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = s.path;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (s.thumb) {
        const img = document.createElement('img');
        img.src = s.thumb;
        img.alt = '';
        img.loading = 'lazy';
        thumb.appendChild(img);
      } else {
        thumb.appendChild(placeholder(s.slug));
      }
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = s.number != null ? String(s.number).padStart(3, '0') : '';
      thumb.appendChild(num);
      if (s.status === 'wip') {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'wip';
        thumb.appendChild(badge);
      }

      const body = document.createElement('div');
      body.className = 'body';
      const title = document.createElement('h2');
      title.className = 'title';
      title.textContent = s.title;
      body.appendChild(title);
      if (s.description) {
        const d = document.createElement('p');
        d.className = 'desc';
        d.textContent = s.description;
        body.appendChild(d);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      if (s.date) meta.insertAdjacentHTML('beforeend', `<span>${s.date}</span>`);
      for (const t of s.tags) {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = t;
        meta.appendChild(span);
      }
      body.appendChild(meta);

      a.append(thumb, body);
      return a;
    }

    function render() {
      grid.replaceChildren();
      const list = active ? all.filter((s) => s.tags.includes(active)) : all;
      if (!list.length) {
        grid.innerHTML = '<p class="empty">No sketches yet. Run <code>npm run new -- "My first sketch"</code>.</p>';
        return;
      }
      for (const s of list) grid.appendChild(card(s));
    }

    function renderFilters() {
      const tags = [...new Set(all.flatMap((s) => s.tags))].sort();
      filters.replaceChildren();
      if (!tags.length) return;
      for (const t of [null, ...tags]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = t ?? 'all';
        b.setAttribute('aria-pressed', String(active === t));
        b.onclick = () => { active = t; renderFilters(); render(); };
        filters.appendChild(b);
      }
    }

    fetch('sketches.json', { cache: 'no-cache' })
      .then((r) => r.json())
      .then((data) => {
        all = data.sketches || [];
        document.getElementById('count').textContent = `${all.length} so far.`;
        renderFilters();
        render();
      })
      .catch(() => {
        grid.innerHTML = '<p class="empty">Couldn\'t load sketches.json. Run <code>npm run index</code>, and preview with <code>npm run dev</code> (opening the file directly won\'t work).</p>';
      });
  </script>
</body>
</html>
