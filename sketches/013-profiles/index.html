<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>013 Profiles</title>
  <link rel="stylesheet" href="../../shared/shell.css">
  <style>
    html, body { background: #f3efe6; }
    .controls {
      position: fixed;
      left: 50%;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 44px); /* above the shell's hint */
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 24px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      z-index: 11;
      font: 500 12px/1.3 ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    .controls button {
      appearance: none;
      font: inherit;
      color: #f2efe8;
      background: rgba(13, 13, 15, 0.72);
      border: 1px solid rgba(242, 239, 232, 0.25);
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls button[aria-pressed="true"] { background: #f2efe8; color: #111; }
    @media (max-width: 480px) { .controls button { padding: 6px 10px; font-size: 11px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="../../shared/shell.js"></script>
</head>
<body>
  <div class="controls">
    <button type="button" id="b-new">new faces</button>
    <button type="button" id="b-style">style: bands</button>
    <button type="button" id="b-guides" aria-pressed="false">guides</button>
    <button type="button" id="b-sing" aria-pressed="false">sing</button>
  </div>
  <script src="../../shared/profiles.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
